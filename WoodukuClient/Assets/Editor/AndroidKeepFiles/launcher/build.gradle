apply plugin: 'com.android.application'

dependencies {
    implementation project(':unityLibrary')
}

android {
    namespace "com.defaultcompany.newfishframework"
    ndkPath "C:/Program Files/Unity/Hub/Editor/2022.3.62f3/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"

    compileSdk 34
    buildToolsVersion '34.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        applicationId 'com.defaultcompany.newfishframework'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        versionCode = ((project.findProperty('VERSION_CODE') ?: '1') as String).toInteger()
        versionName = (project.findProperty('VERSION_NAME') ?: '1.0.0') as String
    }

    aaptOptions {
        noCompress = ['.unity3d', '.ress', '.resource', '.obb', '.bundle', '.unityexp'] + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    lintOptions {
        abortOnError false
    }

    def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE') as String
    def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD') as String
    def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS') as String
    def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD') as String
    def useReleaseSigning = ((project.findProperty('USE_RELEASE_SIGNING') ?: 'false') as String).toBoolean()
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseStoreFile).exists()

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            signingConfig signingConfigs.debug
            jniDebuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
            signingConfig useReleaseSigning && hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        doNotStrip '*/armeabi-v7a/*.so'
        doNotStrip '*/arm64-v8a/*.so'
        jniLibs {
            useLegacyPackaging true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
    }
}
